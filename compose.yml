# Local development. Production, Traefik and resource limits are described in
# docs/08-setup.md.
#
# Rootless Podman:
#   systemctl --user enable --now podman.socket
#   export DOCKER_HOST=unix://$XDG_RUNTIME_DIR/podman/podman.sock
#   podman compose up -d
#
# Docker: docker compose up -d

name: infinity-url

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: infinity_url
      POSTGRES_USER: infinity_url
      POSTGRES_PASSWORD: secret
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infinity_url -d infinity_url"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    # Cache only: no persistence, so no personal data reaches the disk.
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.34
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  pgdata:
